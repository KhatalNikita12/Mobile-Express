[build]
  # CI=false stops CRA from failing the build on ESLint warnings
  command = "CI=false npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# 1) API calls -> Express backend
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 2) React Router: any other path serves the SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
